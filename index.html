<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música en línea · Reproductor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .player {
            max-width: 480px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 32px;
            padding: 24px 20px 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            transition: all 0.2s;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
            fill: #1DB954;
        }

        .header-right {
            display: flex;
            gap: 12px;
            opacity: 0.7;
        }

        .cover-area {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .cover {
            width: 200px;
            height: 200px;
            background: #2a2a2a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: 0.2s;
            background-size: cover;
            background-position: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23555"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>');
            background-size: 60% 60%;
            background-repeat: no-repeat;
        }

        .track-info {
            text-align: center;
            margin-bottom: 18px;
        }

        .track-name {
            font-size: 1.4rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #b3b3b3;
            margin-top: 4px;
            font-size: 0.95rem;
        }

        .progress-area {
            margin: 16px 0 12px;
        }

        .progress-bar {
            background: #4a4a4a;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1DB954;
            border-radius: 4px;
            transition: width 0.2s ease;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a0a0a0;
            margin-top: 6px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin: 18px 0 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }

        .ctrl-btn:hover {
            color: white;
            background: rgba(255,255,255,0.06);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .ctrl-btn.play-btn {
            background: #1DB954;
            color: #121212;
            width: 56px;
            height: 56px;
            font-size: 2.2rem;
        }

        .ctrl-btn.play-btn:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .queue {
            background: #282828;
            border-radius: 16px;
            padding: 12px 8px;
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }

        .queue-item:hover {
            background: #333;
        }

        .queue-item.active {
            background: #3e3e3e;
            border-left: 3px solid #1DB954;
        }

        .queue-item .q-index {
            color: #777;
            font-size: 0.85rem;
            width: 20px;
        }

        .queue-item .q-title {
            flex: 1;
            font-weight: 500;
        }

        .queue-item .q-artist {
            color: #aaa;
            font-size: 0.8rem;
        }

        .footer-note {
            text-align: center;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #555;
            border-top: 1px solid #2a2a2a;
            padding-top: 14px;
        }
    </style>
</head>
<body>
<div class="player">
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.72.48-1.08.24-2.88-1.68-6.48-2.16-10.68-1.2-.48.12-.84-.24-.96-.6-.12-.48.24-.84.6-.96 4.56-1.08 8.64-.48 11.88 1.44.36.24.48.72.24 1.08zm1.44-3.24c-.3.42-.84.6-1.32.3-3.24-2.04-8.28-2.64-12.12-1.44-.48.18-1.02-.06-1.2-.54-.18-.48.06-1.02.54-1.2 4.44-1.32 10.08-.6 13.8 1.8.48.3.6.9.3 1.38zm.12-3.36c-3.96-2.4-10.56-2.64-14.28-1.44-.6.18-1.2-.18-1.38-.78-.18-.6.18-1.2.78-1.38 4.32-1.32 11.64-1.08 16.2 1.68.54.36.72 1.08.36 1.62-.36.48-1.08.66-1.68.3z"/></svg>
            <span>Música</span>
        </div>
        <div class="header-right">
            <span>🔔</span>
            <span>⚙️</span>
        </div>
    </div>

    <div class="cover-area">
        <div class="cover" id="albumCover"></div>
    </div>

    <div class="track-info">
        <div class="track-name" id="trackName">Canción de muestra</div>
        <div class="track-artist" id="trackArtist">Artista</div>
    </div>

    <div class="progress-area">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="Anterior">⏮</button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="Siguiente">⏭</button>
    </div>

    <!-- Lista de reproducción (simulada) -->
    <div class="queue" id="queueContainer">
        <!-- los items se generan dinámicamente -->
    </div>

    <div class="footer-note">
        • Escucha cualquier estilo • (biblioteca de demostración)
    </div>
</div>

<script>
    (function(){
        // ---------- CANCIONES DE EJEMPLO (cualquier género) ----------
        const songs = [
            {
                title: "Blinding Lights",
                artist: "The Weeknd",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://picsum.photos/seed/blinding/200/200"
            },
            {
                title: "Shape of You",
                artist: "Ed Sheeran",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://picsum.photos/seed/shape/200/200"
            },
            {
                title: "Bohemian Rhapsody",
                artist: "Queen",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                cover: "https://picsum.photos/seed/bohemian/200/200"
            },
            {
                title: "Billie Jean",
                artist: "Michael Jackson",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                cover: "https://picsum.photos/seed/billie/200/200"
            },
            {
                title: "Hotel California",
                artist: "Eagles",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                cover: "https://picsum.photos/seed/hotel/200/200"
            },
            {
                title: "Take Five",
                artist: "Dave Brubeck",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
                cover: "https://picsum.photos/seed/takefive/200/200"
            },
            {
                title: "Smells Like Teen Spirit",
                artist: "Nirvana",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
                cover: "https://picsum.photos/seed/nirvana/200/200"
            }
        ];

        // Elementos DOM
        const audio = new Audio();
        let currentIndex = 0;
        let isPlaying = false;

        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackName = document.getElementById('trackName');
        const trackArtist = document.getElementById('trackArtist');
        const albumCover = document.getElementById('albumCover');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');
        const queueContainer = document.getElementById('queueContainer');

        // Cargar canción
        function loadSong(index) {
            const song = songs[index];
            if (!song) return;
            audio.src = song.url;
            trackName.textContent = song.title;
            trackArtist.textContent = song.artist;
            albumCover.style.backgroundImage = `url(${song.cover})`;
            // actualizar cola activa
            document.querySelectorAll('.queue-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        // Reproducir / pausar
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        }

        // Actualizar progreso
        function updateProgress() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                totalTimeSpan.textContent = formatTime(audio.duration);
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function setProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const duration = audio.duration;
            if (duration && width) {
                audio.currentTime = (clickX / width) * duration;
            }
        }

        // Siguiente / anterior
        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            } else {
                // si no estaba sonando, al menos cargamos
            }
            // actualizar botón play si estaba pausado
            if (audio.paused) {
                playBtn.textContent = '▶';
                isPlaying = false;
            } else {
                playBtn.textContent = '⏸';
                isPlaying = true;
            }
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            } else {
                playBtn.textContent = '▶';
                isPlaying = false;
            }
        }

        // Construir cola (lista de canciones)
        function buildQueue() {
            queueContainer.innerHTML = '';
            songs.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = 'queue-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <span class="q-index">${idx + 1}</span>
                    <span class="q-title">${song.title}</span>
                    <span class="q-artist">${song.artist}</span>
                `;
                item.addEventListener('click', () => {
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        loadSong(currentIndex);
                        if (isPlaying) {
                            audio.play().catch(() => {});
                            playBtn.textContent = '⏸';
                        } else {
                            playBtn.textContent = '▶';
                        }
                    } else {
                        // misma canción: toggle play
                        togglePlay();
                    }
                });
                queueContainer.appendChild(item);
            });
        }

        // Eventos
        playBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            prevSong();
        });

        nextBtn.addEventListener('click', () => {
            nextSong();
        });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            totalTimeSpan.textContent = formatTime(audio.duration);
            progressFill.style.width = '0%';
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        progressBar.addEventListener('click', setProgress);

        // Inicializar
        loadSong(0);
        buildQueue();

        // Si el usuario hace clic en la cola, ya manejamos arriba
        // Ajustar botón play cuando el audio se pause externamente (ej. fin del buffer)
        audio.addEventListener('pause', () => {
            if (!audio.ended) {
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        });

        audio.addEventListener('play', () => {
            isPlaying = true;
            playBtn.textContent = '⏸';
        });

        // Permitir arrastrar en el progreso (opcional, mejora UX)
        let isDragging = false;
        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            setProgress(e);
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                setProgress(e);
            }
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Atajos de teclado (espacio)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') {
                nextSong();
            }
            if (e.code === 'ArrowLeft') {
                prevSong();
            }
        });

        console.log('🎵 Reproductor listo · haz clic en cualquier canción');
    })();
</script>
</body>
</html>
